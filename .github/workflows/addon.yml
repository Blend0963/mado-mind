name: Add-on

# The add-on arrived as 25 files that nothing validated. Two things can break it
# without anyone noticing until a user's install fails:
#
#   1. The Dockerfile stops building.
#   2. The Dockerfile fetches the server source from the tested fork ref.
on:
  push:
    branches: [main]
    paths: ["home_mind/**", "src/home-mind-server/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["home_mind/**", "src/home-mind-server/**", ".github/workflows/addon.yml"]

# The job token gets only what the jobs need. Without this it inherits the
# repository default, which CodeQL flags (actions/missing-workflow-permissions);
# a job that needs more, such as pushing an image, says so on the job itself.
permissions:
  contents: read

jobs:
  build:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only, never push. Users build this add-on on their own machine,
      # so there is no registry to publish to and nothing to sign.
      - uses: docker/build-push-action@v6
        with:
          context: home_mind
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.02.0
            MADO_MIND_REF=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
